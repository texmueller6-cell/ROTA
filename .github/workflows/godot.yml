name: "Godot Engine"
on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - released

env:
  GODOT_VERSION: 3.6.2
  EXPORT_NAME: rota-ci

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Cache Godot Engine downloads
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            export/godot
            export/editor_data/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot Engine from GitHub release
        id: download
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p export && cd export

          # Download Godot Engine itself
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux_headless.64.zip && \
          mv Godot_v${GODOT_VERSION}-stable_linux_headless.64 godot

          # Download export templates
          mkdir -p editor_data/export_templates
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz && \
          mv templates editor_data/export_templates/${GODOT_VERSION}.stable

      - name: Export PCK file
        run: |
          # Tell Godot Engine to be self-contained
          touch export/._sc_

          export/godot --no-window --path=. --export-pack "Linux/X11" export/${EXPORT_NAME}.pck

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.EXPORT_NAME }}
          path: export/${{ env.EXPORT_NAME }}.pck

      # ---------- Android ----------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android export
        run: |
          mkdir -p export/editor_data

          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 9999 \
            -alias androiddebugkey -keypass android -storepass android \
            -keystore export/debug.keystore -deststoretype pkcs12 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > export/editor_data/editor_settings-3.tres <<EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/export/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export Android APK
        run: |
          sed -i 's|^gradle_build/use_custom_build=.*|gradle_build/use_custom_build=false|' export_presets.cfg
          sed -i 's|^keystore/release=.*|keystore/release=""|' export_presets.cfg
          sed -i 's|^keystore/release_user=.*|keystore/release_user=""|' export_presets.cfg
          sed -i 's|^keystore/release_password=.*|keystore/release_password=""|' export_presets.cfg
          export/godot --no-window --path=. --export-debug "Android" export/${EXPORT_NAME}.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rota-android
          path: export/${{ env.EXPORT_NAME }}.apk

  release:
    name: Release
    needs: export
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ env.EXPORT_NAME }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mv '${{ env.EXPORT_NAME }}.pck' '${{ env.EXPORT_NAME }}-${{ github.ref_name }}.pck'
          gh release upload '${{ github.ref_name }}' '${{ env.EXPORT_NAME }}-${{ github.ref_name }}.pck' --repo '${{ github.repository }}' --clobber
